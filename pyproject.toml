[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-prep"
version = "0.1.0"
description = "Data preparation pipeline for RAG"
authors = [{name = "Denis"}]
requires-python = ">=3.9"
dependencies = [
    "unstructured[all-docs]",
    "pdfplumber",
    "beautifulsoup4",
    "datasketch",
    "rapidfuzz",
    "pydantic",
    "PyYAML",
    "python-dotenv",
    "typer"
]

[project.scripts]
rag-prep = "src.rag_prep.cli:app"