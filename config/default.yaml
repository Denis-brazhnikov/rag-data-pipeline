run:
  name: "rag_data_preparation"
  seed: 42

paths:
  input_dir: "data/raw"
  output_dir: "data/prepared"

loader:
  recursive: true
  allowed_extensions:
    - .pdf
    - .txt
    - .html
    - .htm
    - .md
  exclude_hidden: true
  num_files_limit: null

parser:
  strategy: "fast"
  fail_on_error: false

cleaning:
  min_chars: 12
  boilerplate_patterns:
    - 'cookie|cookies|куки|cookie policy'
    - 'подписаться|subscribe|newsletter'
    - 'навигация|главное меню|menu'
    - '©|copyright|all rights reserved'

normalization:
  spacy_language: "ru"
  unicode_form: "NFKC"
  lowercase: false

deduplication:
  enabled: true
  threshold: 0.9
  num_perm: 128
  shingle_size: 5
  min_tokens: 8

structuring:
  group_by_section: true

logging:
  level: "INFO"
  mlflow_enabled: true
  mlflow_tracking_uri: "mlruns"
  mlflow_experiment: "rag-data-preparation"